apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: product-uploads
  namespace: mall
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: media-files
  namespace: mall
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-rpc
  namespace: mall
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: user-rpc
  template:
    metadata:
      labels:
        app: user-rpc
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: user-rpc
      containers:
        - name: user-rpc
          image: user-rpc:local
          imagePullPolicy: IfNotPresent
          env:
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: mall-secrets
                  key: JWT_SECRET
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mall-secrets
                  key: MYSQL_ROOT_PASSWORD
          ports:
            - name: rpc
              containerPort: 9000
          volumeMounts:
            - name: config
              mountPath: /app/etc
              readOnly: true
          readinessProbe:
            tcpSocket:
              port: 9000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 9000
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
      volumes:
        - name: config
          configMap:
            name: user-rpc-config
---
apiVersion: v1
kind: Service
metadata:
  name: user-rpc
  namespace: mall
spec:
  selector:
    app: user-rpc
  ports:
    - name: rpc
      port: 9000
      targetPort: 9000
---
