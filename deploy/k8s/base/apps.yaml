apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-api
  namespace: mall
spec:
  replicas: 1
  strategy:
    # uploads 是 RWO 的 local-path 卷，滚动更新会因跨节点挂载失败而卡住
    type: Recreate
  selector:
    matchLabels:
      app: product-api
  template:
    metadata:
      labels:
        app: product-api
    spec:
      containers:
        - name: product-api
          image: product-api:local
          imagePullPolicy: IfNotPresent
          env:
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: mall-secrets
                  key: JWT_SECRET
          ports:
            - name: http
              containerPort: 8002
          volumeMounts:
            - name: config
              mountPath: /app/etc
              readOnly: true
            - name: uploads
              mountPath: /app/uploads
          readinessProbe:
            tcpSocket:
              port: 8002
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8002
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
      volumes:
        - name: config
          configMap:
            name: product-api-config
        - name: uploads
          persistentVolumeClaim:
            claimName: product-uploads
---
apiVersion: v1
kind: Service
metadata:
  name: product-api
  namespace: mall
spec:
  type: NodePort
  selector:
    app: product-api
  ports:
    - name: http
      port: 8002
      targetPort: 8002
      nodePort: 30002
---
