                secretKeyRef:
                  name: mall-secrets
                  key: MYSQL_ROOT_PASSWORD
          ports:
            - name: http
              containerPort: 8003
          volumeMounts:
            - name: config
              mountPath: /app/etc
              readOnly: true
            - name: files
              mountPath: /app/uploads
          readinessProbe:
            tcpSocket:
              port: 8003
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8003
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
      volumes:
        - name: config
          configMap:
            name: media-api-config
        - name: files
          persistentVolumeClaim:
            claimName: media-files
