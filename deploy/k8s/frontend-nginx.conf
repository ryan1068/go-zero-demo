server {
    listen 80;
    server_name _;

    # 集群 DNS 服务名，避免硬编码 CoreDNS ClusterIP
    resolver kube-dns.kube-system.svc.cluster.local valid=10s ipv6=off;

    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml font/ttf image/svg+xml;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/user/ {
        set $user_api http://user-api.mall.svc.cluster.local:8000;
        rewrite ^/api/user/(.*)$ /$1 break;
        proxy_pass $user_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/order/ {
        set $order_api http://order-api.mall.svc.cluster.local:8001;
        rewrite ^/api/order/(.*)$ /$1 break;
        proxy_pass $order_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/product/ {
        set $product_api http://product-api.mall.svc.cluster.local:8002;
        rewrite ^/api/product/(.*)$ /$1 break;
        proxy_pass $product_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 6m;
    }

    location /api/media/ {
        set $media_api http://media-api.mall.svc.cluster.local:8003;
        rewrite ^/api/media/(.*)$ /$1 break;
        proxy_pass $media_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 12m;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
