# 3 节点本地集群：1 个控制面 + 2 个工作节点
# 使用：make k8s-up / make k8s-down / make k8s-status
apiVersion: k3d.io/v1alpha5
kind: Simple
metadata:
  name: mall
servers: 1
agents: 2
ports:
  # 前端：管理后台 / 商城（host 端口必须保持 8080/8081）
  - port: 8080:30080
    nodeFilters:
      - loadbalancer
  - port: 8081:30081
    nodeFilters:
      - loadbalancer
  # API 与网关
  - port: 8000:30000
    nodeFilters:
      - loadbalancer
  - port: 8001:30001
    nodeFilters:
      - loadbalancer
  - port: 8002:30002
    nodeFilters:
      - loadbalancer
  - port: 8888:30088
    nodeFilters:
      - loadbalancer
  # 预留给后续 Ingress
  - port: 8090:80
    nodeFilters:
      - loadbalancer
  - port: 8443:443
    nodeFilters:
      - loadbalancer
options:
  k3s:
    extraArgs:
      # 默认不装 Traefik：首次启动会卡在镜像拉取，需要时再单独安装 Ingress
      - arg: --disable=traefik
        nodeFilters:
          - server:*
  kubeconfig:
    updateDefaultKubeconfig: true
    switchCurrentContext: true
