global:
  scrape_interval: 15s
  external_labels:
    monitor: 'codelab-monitor'

scrape_configs:
  - job_name: 'user-rpc'
    static_configs:
      - targets: ['user-rpc:9100']
  - job_name: 'user-api'
    static_configs:
      - targets: ['user-api:9101']
        labels:
  - job_name: 'order-rpc'
    static_configs:
      - targets: ['order-rpc:9102']
  - job_name: 'order-api'
    static_configs:
      - targets: ['order-api:9103']
        labels:
  - job_name: 'product-rpc'
    static_configs:
      - targets: ['product-rpc:9104']
  - job_name: 'product-api'
    static_configs:
      - targets: ['product-api:9105']
        labels: