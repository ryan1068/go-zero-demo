syntax = "proto3";

package order;
option go_package = "./order";

message EmptyReq {}

message BaseResp {
  int32 code = 1;
  string msg = 2;
}

message CartItemInfo {
  int64 id = 1;
  int64 product_id = 2;
  string product_name = 3;
  string product_cover = 4;
  int64 price = 5;
  int32 stock = 6;
  int32 quantity = 7;
  int32 selected = 8;
  int32 product_status = 9;
  int64 created_at = 10;
  int64 updated_at = 11;
}

message CartListResp {
  int32 code = 1;
  string msg = 2;
  repeated CartItemInfo list = 3;
  int64 total = 4;
}

message AddCartReq {
  int64 product_id = 1;
  int32 quantity = 2;
}

message UpdateCartReq {
  int64 id = 1;
  int32 quantity = 2;
  int32 selected = 3;
}

message CartItemReq {
  int64 id = 1;
}

message SelectCartReq {
  int32 selected = 1;
}

message CartItemResp {
  int32 code = 1;
  string msg = 2;
  CartItemInfo data = 3;
}

message OrderItemInfo {
  int64 id = 1;
  int64 product_id = 2;
  string product_name = 3;
  string product_cover = 4;
  int64 price = 5;
  int32 quantity = 6;
  int64 total_amount = 7;
}

message OrderInfo {
  int64 id = 1;
  string order_no = 2;
  int64 user_id = 3;
  int64 total_amount = 4;
  int64 freight_amount = 5;
  int64 discount_amount = 6;
  int64 pay_amount = 7;
  int32 status = 8;
  int32 pay_type = 9;
  string transaction_id = 10;
  string receiver_name = 11;
  string receiver_phone = 12;
  string receiver_province = 13;
  string receiver_city = 14;
  string receiver_district = 15;
  string receiver_address = 16;
  string receiver_postal_code = 17;
  string remark = 18;
  string admin_remark = 19;
  string logistics_company = 20;
  string tracking_no = 21;
  int64 paid_at = 22;
  int64 shipped_at = 23;
  int64 completed_at = 24;
  int64 canceled_at = 25;
  string cancel_reason = 26;
  int64 created_at = 27;
  int64 updated_at = 28;
  repeated OrderItemInfo items = 29;
}

message OrderResp {
  int32 code = 1;
  string msg = 2;
  OrderInfo data = 3;
}

message CreateOrderReq {
  int64 address_id = 1;
  string remark = 2;
  int32 buy_now = 3;
  int64 product_id = 4;
  int32 quantity = 5;
}

message GetOrderReq {
  int64 id = 1;
  int32 admin = 2;
}

message ListOrdersReq {
  int32 page = 1;
  int32 page_size = 2;
  string order_no = 3;
  int32 status = 4;
  int64 user_id = 5;
  int64 start_time = 6;
  int64 end_time = 7;
  int32 admin = 8;
}

message OrderListResp {
  int32 code = 1;
  string msg = 2;
  repeated OrderInfo list = 3;
  int64 total = 4;
  int32 page = 5;
  int32 page_size = 6;
}

message PayOrderReq {
  int64 id = 1;
}

message CancelOrderReq {
  int64 id = 1;
  string reason = 2;
  int32 admin = 3;
}

message ConfirmOrderReq {
  int64 id = 1;
}

message ShipOrderReq {
  int64 id = 1;
  string logistics_company = 2;
  string tracking_no = 3;
}

message DashboardResp {
  int32 code = 1;
  string msg = 2;
  int64 today_order_count = 3;
  int64 today_paid_amount = 4;
  int64 pending_shipment_count = 5;
  int64 product_count = 6;
  int64 low_stock_count = 7;
}

message AfterSaleInfo {
  int64 id = 1;
  string after_sale_no = 2;
  int64 order_id = 3;
  int64 order_item_id = 4;
  int64 user_id = 5;
  int32 type = 6;
  string reason = 7;
  string description = 8;
  repeated string images = 9;
  int64 amount = 10;
  int32 status = 11;
  string admin_remark = 12;
  string tracking_no = 13;
  int64 apply_at = 14;
  int64 review_at = 15;
  int64 buyer_shipped_at = 16;
  int64 seller_received_at = 17;
  int64 refunded_at = 18;
  int64 created_at = 19;
  int64 updated_at = 20;
  string order_no = 21;
  string product_name = 22;
  string product_cover = 23;
}

message ApplyAfterSaleReq {
  int64 order_id = 1;
  int64 order_item_id = 2;
  int32 type = 3;
  string reason = 4;
  string description = 5;
  repeated string images = 6;
}

message AfterSaleReq {
  int64 id = 1;
  int32 admin = 2;
}

message AfterSaleResp {
  int32 code = 1;
  string msg = 2;
  AfterSaleInfo data = 3;
}

message ListAfterSalesReq {
  int32 page = 1;
  int32 page_size = 2;
  int32 status = 3;
  int32 admin = 4;
}

message AfterSaleListResp {
  int32 code = 1;
  string msg = 2;
  repeated AfterSaleInfo list = 3;
  int64 total = 4;
  int32 page = 5;
  int32 page_size = 6;
}

message HandleAfterSaleReq {
  int64 id = 1;
  string action = 2;
  string admin_remark = 3;
  string tracking_no = 4;
  int32 admin = 5;
}

service Order {
  rpc AddCart(AddCartReq) returns (CartItemResp);
  rpc UpdateCart(UpdateCartReq) returns (CartItemResp);
  rpc DeleteCart(CartItemReq) returns (BaseResp);
  rpc SelectCart(SelectCartReq) returns (BaseResp);
  rpc ListCart(EmptyReq) returns (CartListResp);
  rpc CreateOrder(CreateOrderReq) returns (OrderResp);
  rpc GetOrder(GetOrderReq) returns (OrderResp);
  rpc ListOrders(ListOrdersReq) returns (OrderListResp);
  rpc PayOrder(PayOrderReq) returns (OrderResp);
  rpc CancelOrder(CancelOrderReq) returns (OrderResp);
  rpc ConfirmOrder(ConfirmOrderReq) returns (OrderResp);
  rpc ShipOrder(ShipOrderReq) returns (OrderResp);
  rpc Dashboard(EmptyReq) returns (DashboardResp);
  rpc ApplyAfterSale(ApplyAfterSaleReq) returns (AfterSaleResp);
  rpc ListAfterSales(ListAfterSalesReq) returns (AfterSaleListResp);
  rpc GetAfterSale(AfterSaleReq) returns (AfterSaleResp);
  rpc HandleAfterSale(HandleAfterSaleReq) returns (AfterSaleResp);
}
