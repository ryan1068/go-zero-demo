Name: order.rpc
ListenOn: 0.0.0.0:9001
Mode: dev
Etcd:
  Hosts:
    - etcd:2379
  Key: order.rpc
Mysql:
  DataSource: root:${MYSQL_ROOT_PASSWORD}@tcp(mysql:3306)/looklook_order?charset=utf8mb4&collation=utf8mb4_unicode_ci&parseTime=true&loc=Asia%2FShanghai
CacheRedis:
  Host: redis:6379
  Type: node
  Pass: ${REDIS_PASSWORD}
Prometheus:
  Host: 0.0.0.0
  Port: 9102
  Path: /metrics
