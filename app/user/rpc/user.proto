syntax = "proto3";

package user;
option go_package="./user";

message EmptyReq {}

message UserReq {
  string name = 1;
}

message UserInfo {
  int64 id = 1;
  string username = 2;
  string nickname = 3;
  string email = 4;
  string phone = 5;
  string avatar = 6;
  int32 status = 7;
  string remark = 8;
  int64 created_at = 9;
  int64 updated_at = 10;
  int32 role = 11;
}

message UserResp {
  int32 code = 1;
  string msg = 2;
  UserInfo data = 3;
}

message LoginReq{
  string username = 1;
  string password = 2;
}
message LoginResp{
  int32 code = 1;
  string msg = 2;
  string token = 3;
  int64 user_id = 4;
  string username = 5;
  int32 role = 6;
}

message RegisterReq {
  string username = 1;
  string password = 2;
  string nickname = 3;
  string email = 4;
  string phone = 5;
}

message RegisterResp {
  int32 code = 1;
  string msg = 2;
  UserInfo data = 3;
}

message CreateUserReq {
  string username = 1;
  string password = 2;
  string nickname = 3;
  string email = 4;
  string phone = 5;
  string avatar = 6;
  int32 status = 7;
  string remark = 8;
  int32 role = 9;
}

message CreateUserResp {
  int32 code = 1;
  string msg = 2;
  UserInfo data = 3;
}

message ListUsersReq {
  int32 page = 1;
  int32 page_size = 2;
  string username = 3;
  string nickname = 4;
  string email = 5;
  string phone = 6;
  int32 status = 7;
}

message ListUsersResp {
  int32 code = 1;
  string msg = 2;
  repeated UserInfo list = 3;
  int64 total = 4;
  int32 page = 5;
  int32 page_size = 6;
}

message UpdateUserStatusReq {
  int64 id = 1;
  int32 status = 2;
}

message BaseResp {
  int32 code = 1;
  string msg = 2;
}

message AddressInfo {
  int64 id = 1;
  int64 user_id = 2;
  string receiver_name = 3;
  string receiver_phone = 4;
  string province = 5;
  string city = 6;
  string district = 7;
  string detail_address = 8;
  string postal_code = 9;
  string tag = 10;
  int32 is_default = 11;
  int64 created_at = 12;
  int64 updated_at = 13;
}

message AddressReq {
  int64 id = 1;
}

message AddressResp {
  int32 code = 1;
  string msg = 2;
  AddressInfo data = 3;
}

message ListAddressesResp {
  int32 code = 1;
  string msg = 2;
  repeated AddressInfo list = 3;
}

message SaveAddressReq {
  int64 id = 1;
  string receiver_name = 2;
  string receiver_phone = 3;
  string province = 4;
  string city = 5;
  string district = 6;
  string detail_address = 7;
  string postal_code = 8;
  string tag = 9;
  int32 is_default = 10;
}

message ChangePasswordReq {
  string old_password = 1;
  string new_password = 2;
}

message UpdateUserRoleReq {
  int64 id = 1;
  int32 role = 2;
}

message AuditLogInfo {
  int64 id = 1;
  int64 admin_id = 2;
  string action = 3;
  string target_type = 4;
  int64 target_id = 5;
  string detail = 6;
  int64 created_at = 7;
  string admin_name = 8;
}

message ListAuditLogsReq {
  int32 page = 1;
  int32 page_size = 2;
  int64 admin_id = 3;
  string action = 4;
  string target_type = 5;
}

message ListAuditLogsResp {
  int32 code = 1;
  string msg = 2;
  repeated AuditLogInfo list = 3;
  int64 total = 4;
  int32 page = 5;
  int32 page_size = 6;
}

service User {
  rpc User(UserReq) returns(UserResp);
  rpc Login (LoginReq) returns (LoginResp);
  rpc Register (RegisterReq) returns (RegisterResp);
  rpc CreateUser (CreateUserReq) returns (CreateUserResp);
  rpc ListUsers (ListUsersReq) returns (ListUsersResp);
  rpc UpdateUserStatus (UpdateUserStatusReq) returns (BaseResp);
  rpc ListAddresses (EmptyReq) returns (ListAddressesResp);
  rpc CreateAddress (SaveAddressReq) returns (AddressResp);
  rpc UpdateAddress (SaveAddressReq) returns (AddressResp);
  rpc DeleteAddress (AddressReq) returns (BaseResp);
  rpc SetDefaultAddress (AddressReq) returns (BaseResp);
  rpc ChangePassword (ChangePasswordReq) returns (BaseResp);
  rpc UpdateUserRole (UpdateUserRoleReq) returns (BaseResp);
  rpc ListAuditLogs (ListAuditLogsReq) returns (ListAuditLogsResp);
}
