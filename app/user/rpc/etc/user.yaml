Name: user.rpc
ListenOn: 0.0.0.0:9000
Mode: dev
Etcd:
  Hosts:
    - etcd:2379
  Key: user.rpc
Mysql:
  DataSource: root:${MYSQL_ROOT_PASSWORD}@tcp(mysql:3306)/looklook_usercenter?charset=utf8mb4&collation=utf8mb4_unicode_ci&parseTime=true&loc=Asia%2FShanghai
Jwt:
  Secret: ${JWT_SECRET}
  ExpireHours: 24
Prometheus:
  Host: 0.0.0.0
  Port: 9100
  Path: /metrics
