server {
    listen 80;
    server_name _;

    # gzip 压缩 — 大幅减小 js/css 体积
    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml font/ttf image/svg+xml;

    root /usr/share/nginx/html;
    index index.html;

    # Vue Router history 模式必须 — 所有路由都返回 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API 代理到 go-zero 后端服务
    location /api/user/ {
        proxy_pass http://user-api:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/order/ {
        proxy_pass http://order-api:8001/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 静态资源强缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
