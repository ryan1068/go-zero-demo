server {
    listen 80;
    server_name _;

    # Docker 内置 DNS：后端容器重建后自动重新解析，避免 nginx 缓存旧 IP 导致 502
    resolver 127.0.0.11 valid=10s ipv6=off;

    # gzip 压缩 — 大幅减小 js/css 体积
    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml font/ttf image/svg+xml;

    root /usr/share/nginx/html;
    index index.html;

    # Vue Router history 模式必须 — 所有路由都返回 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API 代理到 go-zero 后端服务
    location /api/user/ {
        set $user_api http://user-api:8000;
        rewrite ^/api/user/(.*)$ /$1 break;
        proxy_pass $user_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/order/ {
        set $order_api http://order-api:8001;
        rewrite ^/api/order/(.*)$ /$1 break;
        proxy_pass $order_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/product/ {
        set $product_api http://product-api:8002;
        rewrite ^/api/product/(.*)$ /$1 break;
        proxy_pass $product_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 6m;
    }

    location /api/media/ {
        set $media_api http://media-api:8003;
        rewrite ^/api/media/(.*)$ /$1 break;
        proxy_pass $media_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 12m;
    }

    # 静态资源强缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
